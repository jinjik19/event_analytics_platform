services:
  db:
    container_name: event_analytics_db
    image: postgres:17-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - event_analytics_db:/var/lib/postgresql/data
      - ./configs/postgres/my_postgres.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dwh:
    container_name: event_analytics_dwh
    image: clickhouse/clickhouse-server:25.11
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${DWH_NAME}
      CLICKHOUSE_USER: ${DWH_USER}
      CLICKHOUSE_PASSWORD: ${DWH_PASSWORD:-secret_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./configs/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  migrator_db:
    image: arigaio/atlas:1.0.0
    env_file:
      - .env
    volumes:
      - ./atlas.hcl:/atlas.hcl
      - ./db/migrations/postgres:/migrations
    command: migrate apply --url "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  cache:
    container_name: event_analytics_cache
    image: valkey/valkey:8-bookworm
    restart: always
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes:
      - event_cache:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stream:
    container_name: event_analytics_stream
    image: valkey/valkey:8-bookworm
    restart: always
    command: valkey-server /etc/valkey/stream.conf
    volumes:
      - ./configs/valkey/stream.conf:/etc/valkey/stream.conf
      - ./valkey_data_stream:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: event_analytics_api
    build: .
    restart: always
    depends_on:
      migrator_db:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      stream:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: >
      granian
      --interface asgi
      --host 0.0.0.0
      --port 8000
      --reload
      --workers ${WEB_CONCURRENCY:-1}
      entrypoint.api.main:app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    container_name: event_analytics_worker
    build: .
    command: python -m src.entrypoint.worker.main
    depends_on:
      stream:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    volumes:
      - ./src:/app/src
    ports:
      - "8001:8001"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.9
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - 18081:18081 # Schema Registry
      - 18082:18082 # HTTP Proxy (host)
      - 19092:19092 # host
      - 9644:9644 # Admin API (host)
    volumes:
      - redpanda_data:/var/lib/redpanda
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -f http://localhost:9644/v1/status/ready || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.3
    container_name: redpanda_ui
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      # Basic Auth
      LOGIN_ENABLED: "true"
      AUTH_BASIC_USERS_0_USERNAME: ${CONSOLE_AUTH_USER:-ui_admin}
      AUTH_BASIC_USERS_0_PASSWORD: ${CONSOLE_AUTH_PASSWORD:-ui_password}
      # Connect Schema Registry
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://redpanda:8081"
    ports:
      - "8080:8080" # UI in browser
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: event_analytics_prometheus
    restart: always
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.3.3
    container_name: event_analytics_grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana

  seeder:
    container_name: event_analytics_seeder
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    profiles:
      - seeder
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      - API_HOST=http://api:8000
      - SEEDER_SPEED=${SEEDER_SPEED:-1.0}
      - SEEDER_USERS=${SEEDER_USERS:-5}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: python /app/scripts/seeder.py

volumes:
  event_analytics_db:
  event_cache:
  prometheus_data:
  grafana_data:
  clickhouse_data:
  redpanda_data:
